services:
  mc:
    build: .
    container_name: mc-server
    ports:
      - "25565:25565"
    volumes:
      - ./server-data:/data:z
      - ./backups:/backups:z
      - ./modrinth-instance:/modpack:z
      - ./start.sh:/minecraft/start.sh
      - ./backup.sh:/minecraft/backup.sh
    # Performance & tuning values: edit server.env
    env_file:
      - server.env
    # Keep the console attachable (./manage.sh console)
    stdin_open: true
    tty: true
    # Give Java time to save the world on stop (Docker's default is 10s)
    stop_grace_period: 2m
    restart: unless-stopped
